name: Build web workspace

on:
  pull_request:
    paths:
      - 'web/**'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check backend Python syntax
        run: python -m compileall -q backend
      - name: Check static workspace JavaScript syntax
        run: node --check frontend/js/notely-workspace.js
      - name: Check shared theme JavaScript syntax
        run: node --check frontend/js/notely-theme.js
      - name: Check auth and workspace JavaScript syntax
        run: |
          node --check frontend/js/auth.js
          node --check frontend/js/app.js
          node --check frontend/js/main.js
          node --check frontend/js/sidebar.js
          node --check frontend/js/dashboard.js
          node --check frontend/js/onboarding.js
          node --check frontend/js/topic.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Lint Next.js workspace
        run: npx eslint .
        working-directory: web
      - name: Build Next.js workspace
        run: npm run build
        working-directory: web
