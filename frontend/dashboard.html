<!doctype html>
<html lang="en">
<head>
  <script>window.NOTELY_AUTH_FLOW_ENABLED=false;</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#060c1c" />
  <script>
    (function(){try{var s=localStorage.getItem("notely-theme")||localStorage.getItem("ss_theme");var t=s==="light"||s==="dark"?s:(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;}catch(e){document.documentElement.setAttribute("data-theme",window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}})();
  </script>
  <title>Notely — Workspace</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.png" />
  <link rel="stylesheet" href="/css/notely-workspace.css" />
  <link rel="stylesheet" href="/css/notely-shutter.css" />
  <link rel="stylesheet" href="/css/notely-flow.css" />
  <script>(function(){try{if(sessionStorage.getItem('notely-shutter-next')==='1')document.documentElement.classList.add('notely-shutter-pending');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/notely-theme-shared.css" />
  <link rel="stylesheet" href="/css/notely-lottie-icons.css" />
  <link rel="stylesheet" href="/css/notely-chat-home.css" />
  <link rel="stylesheet" href="/css/notely-workspace-spec.css" />
  <link rel="stylesheet" href="/css/notely-tool-sections.css" />
</head>
<body>
  <div id="notely-shutter" class="notely-shutter-overlay" aria-hidden="true"><div class="notely-shutter-inner"><img src="/assets/logo.png" alt="Notely"></div></div>
  <div class="nw-shell">
    <aside class="nw-sidebar" id="nwSidebar" aria-label="Workspace sidebar">
      <div class="nw-brand">
        <img src="/assets/notely-symbol.svg" alt="Notely logo" />
        <span class="nw-brand-name">Notely</span>
        <button class="nw-icon nw-collapse" id="nwCollapse" aria-label="Collapse sidebar" type="button">‹</button>
      </div>
      <nav class="nw-nav" aria-label="Notely navigation">
        <button class="nch-sidebar-new" id="nchSidebarNewChat" type="button"><span class="nch-plus" aria-hidden="true">＋</span><span>New chat</span></button>
        <div class="nch-primary-nav" role="navigation" aria-label="Notely navigation">
          <button type="button" data-spec-page="library"><span>▤</span>Library</button>
          <button type="button" data-spec-page="schedule"><span>◷</span>Schedule</button>
        </div>
        <button type="button" data-view="overview" id="nchHiddenHome" hidden aria-hidden="true"></button>
        <div class="nch-chat-history" id="nchChatHistory"><div class="nch-history-loading">Loading conversations…</div></div>
      </nav>
      <div class="nw-sidebar-bottom">
        <button class="nw-user" type="button" aria-label="Open account menu">
          <i id="nwUserAvatar">N</i>
          <span><b id="nwUserName">Student</b><small>Account menu</small></span>
          <span class="nch-user-dots" aria-hidden="true">⋯</span>
        </button>
      </div>
    </aside>
    <button class="nw-scrim" id="nwScrim" aria-label="Close navigation" type="button"></button>
    <main class="nw-main">
      <header class="nw-topbar">
        <button class="nw-mobile-menu nw-icon" id="nwMenu" type="button" aria-label="Open navigation">☰</button>
        <div class="nw-crumb"><span>Notely</span><b>/</b><strong id="nwTitle">Home</strong></div>
        <div class="nw-top-actions">
          <button class="nw-top-new" id="nchNewChat" type="button"><span aria-hidden="true">＋</span> New Chat</button>
          <button class="notely-theme-toggle" type="button" data-notely-theme-toggle aria-label="Switch theme" title="Switch theme (Shift+T)" aria-pressed="false">
            <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>
            <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.7 8.7 0 1 0 20.2 15.4Z"></path></svg>
          </button>
        </div>
      </header>
      <section id="nwContent" class="nw-content"><div class="nw-loading">Preparing your workspace…</div></section>
      <nav class="nw-bottom-nav" aria-label="Mobile workspace navigation">
        <button data-view="overview" type="button"><span aria-hidden="true">⌂</span><small>Home</small></button>
        <button data-view="notes" type="button"><span aria-hidden="true">▤</span><small>Notes</small></button>
        <button data-view="tools" type="button"><span aria-hidden="true">▣</span><small>Tools</small></button>
        <button data-view="settings" type="button"><span aria-hidden="true">⚙</span><small>Settings</small></button>
      </nav>
    </main>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/notely-workspace.js"></script>
  <script src="/js/notely-trial-workspace.js"></script>
  <script src="/js/notely-chat-home.js"></script>
  <script src="/js/notely-workspace-spec.js"></script>
  <script src="/js/notely-tool-sections.js"></script>
  <script src="/js/notely-theme.js" defer></script>
  <script src="/js/notely-shutter.js"></script>
  <script defer src="/js/notely-lottie-registry.js"></script>
  <script defer src="/js/notely-lottie-icons.js"></script>
</body>
</html>
