<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#060c1c" />
  <script>
    (function(){try{var s=localStorage.getItem("notely-theme")||localStorage.getItem("ss_theme");var t=s==="light"||s==="dark"?s:(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;}catch(e){document.documentElement.setAttribute("data-theme",window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}})();
  </script>
  <title>Notely — Workspace</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.png" />
  <link rel="stylesheet" href="/css/notely-workspace.css" />
  <link rel="stylesheet" href="/css/notely-shutter.css" />
  <script>(function(){try{if(sessionStorage.getItem('notely-shutter-next')==='1')document.documentElement.classList.add('notely-shutter-pending');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/notely-theme-shared.css" />
</head>
<body>
  <div id="notely-shutter" class="notely-shutter-overlay" aria-hidden="true"><div class="notely-shutter-inner"><img src="/assets/logo.png" alt="Notely"></div></div>
  <div class="nw-shell">
    <aside class="nw-sidebar" id="nwSidebar">
      <div class="nw-brand"><img src="/assets/logo.png" alt="Notely logo" /><span class="nw-brand-name">Notely</span><button class="nw-icon nw-collapse" id="nwCollapse" aria-label="Toggle sidebar">‹</button></div>
      <button class="nw-primary" data-new-note type="button"><span>＋</span> New note</button>
      <button class="nw-search" data-view="search"><span>⌕</span> Search anything <kbd>⌘ K</kbd></button>
      <nav class="nw-nav" aria-label="Workspace navigation">
        <span>WRITE</span>
        <button data-view="notebooks"><span class="nw-nav-icon" aria-hidden="true">▤</span><b>Notebooks</b></button>
        <button data-view="documents"><span class="nw-nav-icon" aria-hidden="true">▧</span><b>Course materials</b></button>
        <button data-view="lectures"><span class="nw-nav-icon" aria-hidden="true">◷</span><b>Recorded lectures</b></button>
        <span>PRACTICE</span>
        <button data-view="flashcards"><span class="nw-nav-icon" aria-hidden="true">▣</span><b>Flashcards</b></button>
        <button data-view="quizzes"><span class="nw-nav-icon" aria-hidden="true">?</span><b>Quizzes</b></button>
        <button data-view="mindmaps"><span class="nw-nav-icon" aria-hidden="true">◎</span><b>Mind maps</b></button>
        <button data-view="roadmap"><span class="nw-nav-icon" aria-hidden="true">⌁</span><b>Study roadmap</b></button>
        <span>PLAN</span>
        <button data-view="tasks"><span class="nw-nav-icon" aria-hidden="true">✓</span><b>Tasks & calendar</b></button>
        <button data-view="revision"><span class="nw-nav-icon" aria-hidden="true">↻</span><b>Revision planner</b></button>
      </nav>
      <div class="nw-sidebar-bottom">
        <button class="nw-settings-link" data-view="settings" type="button"><span aria-hidden="true">⚙</span> Settings</button>
        <div class="nw-sync"><span>Workspace sync</span><small>Your notes stay in your workspace</small></div>
        <button class="nw-user" data-view="settings" type="button"><i>S</i><span><b id="nwUserName">Student</b><small>Student workspace</small></span>⋯</button>
      </div>
    </aside>
    <button class="nw-scrim" id="nwScrim" aria-label="Close navigation"></button>
    <main class="nw-main">
      <header class="nw-topbar">
        <button class="nw-mobile-menu nw-icon" id="nwMenu" type="button" aria-label="Open navigation">☰</button>
        <div class="nw-crumb"><span>Workspace</span><b>/</b><strong id="nwTitle">Home</strong></div>
        <div class="nw-top-actions">
          <button class="nw-top-search" data-view="search" type="button" aria-label="Search workspace">⌕ <span>Search</span><kbd>Ctrl K</kbd></button>
          <button class="nw-top-new" data-new-note type="button"><span aria-hidden="true">＋</span> New note</button>
          <button class="notely-theme-toggle" type="button" data-notely-theme-toggle aria-label="Switch theme" title="Switch theme (Shift+T)" aria-pressed="false"><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg><svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.7 8.7 0 1 0 20.2 15.4Z"></path></svg></button>
          <button class="nw-avatar" data-view="settings" type="button" aria-label="Open profile and settings">S</button>
        </div>
      </header>
      <section id="nwContent" class="nw-content"><div class="nw-loading">Preparing your workspace…</div></section>
      <nav class="nw-bottom-nav" aria-label="Mobile workspace navigation">
        <button data-view="overview" type="button"><span aria-hidden="true">⌂</span><small>Home</small></button>
        <button data-view="notebooks" type="button"><span aria-hidden="true">▤</span><small>Write</small></button>
        <button data-view="tools" type="button"><span aria-hidden="true">▣</span><small>Practice</small></button>
        <button data-view="tasks" type="button"><span aria-hidden="true">✓</span><small>Plan</small></button>
      </nav>
    </main>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/notely-workspace.js"></script>
  <script src="/js/notely-theme.js" defer></script>
  <script src="/js/notely-shutter.js"></script>
</body>
</html>
