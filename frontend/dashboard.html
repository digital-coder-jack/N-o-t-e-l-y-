<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#060c1c" />\n  <script>\n    (function(){try{var s=localStorage.getItem("notely-theme")||localStorage.getItem("ss_theme");var t=s==="light"||s==="dark"?s:(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;}catch(e){document.documentElement.setAttribute("data-theme",window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}})();\n  </script>
  <title>Notely — Workspace</title>
  <link rel="icon" type="image/svg+xml" href="/assets/notely-logo.svg" />
  <link rel="stylesheet" href="/css/notely-workspace.css" />\n  <link rel="stylesheet" href="/css/notely-theme-shared.css" />
</head>
<body>
  <div class="nw-shell">
    <aside class="nw-sidebar" id="nwSidebar">
      <div class="nw-brand"><img src="/assets/notely-logo-wordmark.svg" alt="Notely" /><button class="nw-icon nw-collapse" id="nwCollapse" aria-label="Toggle sidebar">‹</button></div>
      <button class="nw-primary" data-view="notes"><span>＋</span> New note</button>
      <button class="nw-search" data-view="search"><span>⌕</span> Search anything <kbd>⌘ K</kbd></button>
      <nav class="nw-nav" aria-label="Workspace navigation">
        <span>Workspace</span>
        <button data-view="overview">◈ <b>Overview</b></button>
        <button data-view="notes">▤ <b>My notes</b></button>
        <button data-view="assistant">✦ <b>AI assistant</b><em>AI</em></button>
        <button data-view="documents">▧ <b>Documents</b></button>
        <span>Library</span>
        <button data-view="favorites">★ <b>Favorites</b></button>
        <button data-view="archive">□ <b>Archive</b></button>
        <button data-view="trash">⌫ <b>Trash</b></button>
        <span>Study tools</span>
        <button data-view="tools">✧ <b>Tools hub</b><em>5</em></button>
        <button data-view="settings">⚙ <b>Settings</b></button>
      </nav>
      <div class="nw-sidebar-bottom"><div class="nw-sync">☁ Cloud sync on<small>Data is saved to your workspace</small></div><button class="nw-user" data-view="settings"><i>JL</i><span><b id="nwUserName">Jamie Lee</b><small>Student workspace</small></span>⋯</button></div>
    </aside>
    <button class="nw-scrim" id="nwScrim" aria-label="Close navigation"></button>
    <main class="nw-main">
      <header class="nw-topbar"><button class="nw-mobile-menu" id="nwMenu">☰</button><div class="nw-crumb">Workspace <b>/</b> <strong id="nwTitle">Overview</strong></div><div class="nw-top-actions"><button class="nw-top-search" data-view="search">⌕ <span>Search</span><kbd>⌘ K</kbd></button><button class="nw-bell" aria-label="Notifications">♧<i></i></button><button class="notely-theme-toggle" type="button" data-notely-theme-toggle aria-label="Switch theme" title="Switch theme (Shift+T)" aria-pressed="false"><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg><svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.7 8.7 0 1 0 20.2 15.4Z"></path></svg></button><button class="nw-avatar" data-view="settings">JL</button></div></header>
      <section id="nwContent" class="nw-content"><div class="nw-loading">Preparing your workspace…</div></section>
    </main>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/notely-workspace.js"></script>\n  <script src="/js/notely-theme.js" defer></script>
</body>
</html>
